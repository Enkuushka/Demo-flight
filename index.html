<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Patrol</title>
<meta name="description" content="Patrol: a pixel-art fighter jet flying toy over autumn lake country at the last light of day.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f6e7cf;
    --ink-dim: #c8b3c4;
    --ink-faint: #8f7a99;
    --night: #17111f;
    --plum: #2a1f3a;
    --gold: #ffcf6e;
    --ember: #ff8a3c;
    --pixel: "Silkscreen", "Courier New", monospace;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--night);
    color: var(--ink); font-family: var(--mono);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; overflow: hidden; cursor: none; background: var(--night); }
  #stage canvas {
    position: absolute; left: 0; top: 0;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #ui { pointer-events: none; }

  /* ---------- loading ---------- */
  #loader {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 4px),
      linear-gradient(#1d1529 0 46%, #22192f 46% 62%, #2a1e37 62% 74%, #33233d 74% 84%, #3e2840 84% 92%, #4a2c3e 92%);
    z-index: 30; transition: opacity .9s steps(6);
  }
  #loader.gone { opacity: 0; pointer-events: none; }
  .logo {
    font-family: var(--pixel); font-weight: 700; letter-spacing: .02em; line-height: 1;
    color: var(--gold);
    text-shadow: 0 4px 0 #b4532a, 0 8px 0 #5b2440, 0 12px 0 rgba(20,10,30,.55);
  }
  #loader .logo { font-size: clamp(44px, 9vw, 96px); }
  #loadbar {
    margin-top: 44px; width: min(360px, 72vw); height: 18px; padding: 3px;
    background: #120c19; box-shadow: 0 0 0 3px #4b3858, 0 0 0 6px #120c19;
  }
  #loadfill {
    height: 100%; width: 0%;
    background: repeating-linear-gradient(90deg, var(--gold) 0 10px, #e9a54a 10px 12px);
    transition: width .15s steps(3);
  }
  #loadtext { margin-top: 18px; font-size: 12px; color: var(--ink-dim); letter-spacing: .06em; min-height: 1.4em; }

  /* ---------- title card ---------- */
  #title {
    position: fixed; left: 0; right: 0; top: 11%; text-align: center; z-index: 20; pointer-events: none;
    transition: opacity 1.2s steps(8), transform 1.2s steps(8);
  }
  #title .logo { font-size: clamp(56px, 12vw, 148px); }
  #title .sub {
    display: inline-block; margin-top: 22px; padding: 6px 14px; font-size: clamp(11px, 1.5vw, 15px); color: var(--ink);
    letter-spacing: .14em; text-transform: uppercase; text-shadow: 0 2px 0 rgba(30,15,40,.9);
    background: rgba(28,18,40,.42);
  }
  #title .go {
    position: fixed; left: 0; right: 0; bottom: 9%; font-family: var(--pixel); font-size: clamp(13px, 1.7vw, 18px); color: var(--gold);
    text-shadow: 0 2px 0 #5b2440; animation: blink 1.1s steps(2) infinite;
  }
  #title .go span { display: inline-block; padding: 6px 14px; background: rgba(28,18,40,.5); }
  #title.gone { opacity: 0; transform: translateY(-16px); }
  @keyframes blink { 50% { opacity: .25; } }

  /* ---------- hint strip ---------- */
  #hints {
    position: fixed; left: 0; right: 0; top: 0; z-index: 15; height: 30px;
    display: flex; align-items: center; gap: 18px; padding: 0 12px;
    font-size: 11.5px; letter-spacing: .04em; color: var(--ink-dim);
    background: rgba(23,17,31,.62);
    border-bottom: 1px solid rgba(255,220,180,.08);
    opacity: 0; transition: opacity .8s steps(5);
    pointer-events: none;
  }
  #hints.on { opacity: 1; }
  #hints .keys { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hints b { color: var(--ink); font-weight: 500; }
  #hints .sep { color: var(--ink-faint); margin: 0 6px; }
  #msl { display: flex; align-items: center; gap: 6px; color: var(--ink); white-space: nowrap; }
  #msl .pips { display: inline-flex; gap: 3px; }
  #msl .pip { width: 6px; height: 10px; background: var(--gold); box-shadow: inset 0 -2px 0 #b4532a; }
  #msl .pip.off { background: #3b2d48; box-shadow: none; }
  #msl .pip.arm { background: #7b5a3a; animation: blink .5s steps(2) infinite; }
  #sound {
    pointer-events: auto; cursor: pointer; font: inherit; font-size: 11px; letter-spacing: .08em;
    color: var(--ink-dim); background: rgba(255,255,255,.04); border: 1px solid rgba(255,220,180,.18);
    padding: 3px 8px; border-radius: 0;
  }
  #sound:hover { color: var(--ink); border-color: rgba(255,220,180,.4); }
  #sound.on { color: var(--gold); border-color: rgba(255,207,110,.5); }

  /* ---------- touch controls ---------- */
  #touch { position: fixed; inset: 0; z-index: 16; pointer-events: none; display: none; }
  body.touch #touch { display: block; }
  .tbtn {
    position: absolute; pointer-events: auto; width: 74px; height: 74px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--pixel); font-size: 13px; color: var(--ink); letter-spacing: .04em;
    background: rgba(30,20,42,.38); border: 2px solid rgba(255,220,180,.35);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.25);
  }
  .tbtn.down { background: rgba(255,170,80,.35); border-color: var(--gold); color: #fff; }
  #tFire { right: 22px; bottom: 26px; width: 86px; height: 86px; border-color: rgba(255,120,80,.6); }
  #tBurn { right: 122px; bottom: 22px; }
  #tRoll { right: 40px; bottom: 126px; }
  #tView { right: 140px; bottom: 112px; width: 58px; height: 58px; font-size: 11px; }
  #stick {
    position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%;
    border: 2px dashed rgba(255,220,180,.35); display: none;
  }
  #stick i { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: rgba(255,207,110,.55); }

  #fail {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    padding: 24px; background: var(--night); color: var(--ink); z-index: 40; font-size: 14px; line-height: 1.6;
  }
  @media (max-width: 720px) {
    #hints { font-size: 10px; gap: 10px; height: 26px; }
    #hints .keys .opt { display: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="ui"></canvas>
</div>

<div id="loader">
  <div class="logo">PATROL</div>
  <div id="loadbar"><div id="loadfill"></div></div>
  <div id="loadtext">warming up</div>
</div>

<div id="title" class="gone">
  <div class="logo">PATROL</div>
  <div class="sub">an evening sortie over the lake country</div>
  <div class="go"><span id="titleGo">move the mouse to take the stick</span></div>
</div>

<div id="hints">
  <div class="keys" id="hintKeys"><b>mouse</b> steer<span class="sep">/</span><b>click</b> roll<span class="sep">/</span><b>hold</b> afterburner<span class="sep">/</span><b>right-click</b> or <b>F</b> missile<span class="sep">/</span><b>space</b> view<span class="opt"><span class="sep">/</span><b>M</b> sound</span></div>
  <div id="msl">MSL <span class="pips" id="pips"></span></div>
  <button id="sound" type="button" aria-pressed="false">SOUND OFF</button>
</div>

<div id="touch">
  <div id="stick"><i></i></div>
  <div class="tbtn" id="tView">VIEW</div>
  <div class="tbtn" id="tRoll">ROLL</div>
  <div class="tbtn" id="tBurn">BURN</div>
  <div class="tbtn" id="tFire">FIRE</div>
</div>

<div id="fail"></div>
<script id="gen-src" type="text/js-worker">
// ---- world generator (runs inside web workers) ----
'use strict';
const GX = new Float32Array(256), GY = new Float32Array(256);
for (let i = 0; i < 256; i++) { const a = (i / 256) * Math.PI * 2 + 0.123; GX[i] = Math.cos(a); GY[i] = Math.sin(a); }
function hash2(i, j, s) {
  let h = Math.imul(i, 0x27d4eb2d) ^ Math.imul(j + 0x3c6ef372, 0x165667b1) ^ Math.imul(s + 0x1b873593, 0x9e3779b9);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return (h ^ (h >>> 16)) >>> 0;
}
// periodic gradient noise, period P lattice cells, roughly -1..1
function pnoise(x, y, P, s) {
  const xf = Math.floor(x), yf = Math.floor(y);
  const fx = x - xf, fy = y - yf;
  let i0 = xf % P; if (i0 < 0) i0 += P;
  let j0 = yf % P; if (j0 < 0) j0 += P;
  const i1 = i0 + 1 === P ? 0 : i0 + 1, j1 = j0 + 1 === P ? 0 : j0 + 1;
  const a = hash2(i0, j0, s) & 255, b = hash2(i1, j0, s) & 255, c = hash2(i0, j1, s) & 255, d = hash2(i1, j1, s) & 255;
  const n00 = GX[a] * fx + GY[a] * fy, n10 = GX[b] * (fx - 1) + GY[b] * fy;
  const n01 = GX[c] * fx + GY[c] * (fy - 1), n11 = GX[d] * (fx - 1) + GY[d] * (fy - 1);
  const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10), v = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
  const nx0 = n00 + (n10 - n00) * u, nx1 = n01 + (n11 - n01) * u;
  return (nx0 + (nx1 - nx0) * v) * 1.45;
}
// fbm over unit tile coords (u,v) with base period P
function fbm(u, v, P, oct, s, gain) {
  let a = 1, sum = 0, norm = 0, p = P;
  for (let o = 0; o < oct; o++) { sum += a * pnoise(u * p, v * p, p, s + o * 101); norm += a; p *= 2; a *= gain; }
  return sum / norm;
}
function ridged(u, v, P, oct, s) {
  let a = 0.5, sum = 0, w = 1, p = P;
  for (let o = 0; o < oct; o++) {
    let n = 1 - Math.abs(pnoise(u * p, v * p, p, s + o * 131));
    n *= n; n *= w; w = Math.min(1, Math.max(0, n * 1.8));
    sum += n * a; p *= 2; a *= 0.5;
  }
  return sum;
}
function sstep(a, b, x) { let t = (x - a) / (b - a); t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); }

// terrain height in metres at tile coords (u,v) in [0,1)
function terrainAt(u, v, S) {
  // domain warp keeps shapes organic (and the warp itself tiles)
  const wx = fbm(u, v, 3, 3, S + 7, 0.5) * 0.045 + fbm(u, v, 11, 2, S + 9, 0.5) * 0.008;
  const wy = fbm(u, v, 3, 3, S + 8, 0.5) * 0.045 + fbm(u, v, 11, 2, S + 10, 0.5) * 0.008;
  const x = u + wx, y = v + wy;
  // rolling base with elongated glacial grain
  const base = fbm(x, y, 5, 5, S + 11, 0.52);
  const hills = fbm(x, y, 16, 4, S + 21, 0.5);
  const mmask = sstep(0.05, 0.5, fbm(x, y, 2, 3, S + 31, 0.5));
  const r = ridged(x, y, 7, 5, S + 41);
  let h = base * 105 - 4 + hills * 40 + mmask * (r * r * 640 + 50 * r);
  // fine grain
  h += fbm(x, y, 96, 2, S + 51, 0.5) * 3.0;
  // lake basins: deepen gradually, flatten shallows
  if (h < 0) {
    const d = -h;
    h = -(d * 0.55 + d * d * 0.004);
  } else if (h < 10) {
    // gentle beaches and flats near the waterline
    h = h * (0.45 + 0.055 * h);
  }
  // subtle terraces on the lower hills only
  if (h > 4 && h < 260) {
    const step = 14;
    const q = Math.floor(h / step) * step, f = (h - q) / step;
    const tf = f < 0.7 ? f * 0.35 / 0.7 : 0.35 + (f - 0.7) / 0.3 * 0.65;
    h = h + ((q + tf * step) - h) * 0.16 * (1 - sstep(190, 260, h));
  }
  return h;
}

function genTerrainRows(N, S, row0, row1) {
  // heights at full res; detail channels at half res (rows must be even)
  const rows = row1 - row0, M = N >> 1;
  const heights = new Float32Array(N * rows);
  const det = new Uint8Array(M * (rows >> 1) * 4);
  for (let j = row0; j < row1; j++) {
    const v = j / N;
    for (let i = 0; i < N; i++) heights[(j - row0) * N + i] = terrainAt(i / N, v, S);
  }
  const c8 = (x) => Math.max(0, Math.min(255, (x * 0.5 + 0.5) * 255));
  for (let j = row0 >> 1; j < row1 >> 1; j++) {
    const v = j / M;
    for (let i = 0; i < M; i++) {
      const u = i / M, k = ((j - (row0 >> 1)) * M + i) * 4;
      // forest density: patchy stands
      const fd = fbm(u, v, 22, 4, S + 61, 0.55) * 0.9 + fbm(u, v, 6, 2, S + 62, 0.5) * 0.5;
      // forest hue: orange .. crimson .. gold, in large patches
      const fh = fbm(u, v, 9, 3, S + 71, 0.55) * 0.75 + fbm(u, v, 40, 2, S + 72, 0.5) * 0.35;
      // conifer share
      const cf = fbm(u, v, 14, 3, S + 91, 0.5);
      // meadow / field variation
      const mv = fbm(u, v, 30, 3, S + 81, 0.5);
      det[k] = c8(fd); det[k + 1] = c8(fh); det[k + 2] = c8(cf); det[k + 3] = c8(mv);
    }
  }
  return { heights, det };
}

// cumulus field: flat bases, a rounded body and cauliflower turrets stacked on top.
// returns dome height (m) above the cloud base.
function genClouds(NC, S, tileC, hMax) {
  hMax = hMax || 228;
  const H = new Float32Array(NC * NC);
  const texel = tileC / NC;
  let seed = (S * 7919 + 17) >>> 0;
  const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  const sample = (x, z) => {
    let ii = Math.floor(x / texel) % NC; if (ii < 0) ii += NC;
    let jj = Math.floor(z / texel) % NC; if (jj < 0) jj += NC;
    return H[jj * NC + ii];
  };
  const splat = (cx, cz, r, hmul, lift) => {
    const ri = Math.ceil(r / texel) + 1;
    const ci = Math.floor(cx / texel), cj = Math.floor(cz / texel);
    for (let dj = -ri; dj <= ri; dj++) {
      for (let di = -ri; di <= ri; di++) {
        const px = (ci + di + 0.5) * texel - cx, pz = (cj + dj + 0.5) * texel - cz;
        const d2 = px * px + pz * pz;
        if (d2 >= r * r) continue;
        const hh = Math.min(hMax, lift + Math.sqrt(r * r - d2) * hmul);
        let ii = (ci + di) % NC; if (ii < 0) ii += NC;
        let jj = (cj + dj) % NC; if (jj < 0) jj += NC;
        const k = jj * NC + ii;
        if (hh > H[k]) H[k] = hh;
      }
    }
  };
  let placed = 0, tries = 0;
  while (placed < 360 && tries < 30000) {
    tries++;
    const u = rnd(), v = rnd();
    const cov = fbm(u, v, 3, 3, S + 301, 0.5);
    if (cov < -0.05 + rnd() * 0.3) continue;
    placed++;
    const cx = u * tileC, cz = v * tileC;
    const R = 55 + rnd() * 95;
    // body
    const nb = 3 + Math.floor(rnd() * 4);
    for (let b = 0; b < nb; b++) {
      const a = rnd() * Math.PI * 2, dd = rnd() * R * 0.7;
      splat(cx + Math.cos(a) * dd, cz + Math.sin(a) * dd * 0.85, R * (0.55 + rnd() * 0.35), 0.62 + rnd() * 0.2, 0);
    }
    // turrets, each sitting on what is already there
    const nt = 5 + Math.floor(rnd() * 9);
    for (let b = 0; b < nt; b++) {
      const a = rnd() * Math.PI * 2, dd = Math.sqrt(rnd()) * R * 0.75;
      const x = cx + Math.cos(a) * dd, z = cz + Math.sin(a) * dd * 0.85;
      const r = R * (0.22 + rnd() * 0.3);
      splat(x, z, r, 0.95 + rnd() * 0.5, sample(x, z) * (0.55 + rnd() * 0.3));
    }
  }
  // small fair-weather puffs
  for (let n = 0; n < 260; n++) {
    const cx = rnd() * tileC, cz = rnd() * tileC, r = 18 + rnd() * 34;
    splat(cx, cz, r, 0.8, 0);
    for (let k = 0; k < 3; k++) if (rnd() < 0.7) { const x = cx + (rnd() - 0.5) * r * 1.4, z = cz + (rnd() - 0.5) * r; splat(x, z, r * (0.4 + rnd() * 0.3), 1.0, sample(x, z) * 0.6); }
  }
  return H;
}

if (typeof WorkerGlobalScope !== 'undefined' && self instanceof WorkerGlobalScope) {
  self.onmessage = (e) => {
    const m = e.data;
    if (m.type === 'terrain') {
      const r = genTerrainRows(m.N, m.seed, m.row0, m.row1);
      self.postMessage({ type: 'terrain', id: m.id, row0: m.row0, row1: m.row1, heights: r.heights, det: r.det }, [r.heights.buffer, r.det.buffer]);
    } else if (m.type === 'clouds') {
      const H = genClouds(m.NC, m.seed, m.tileC);
      self.postMessage({ type: 'clouds', id: m.id, H }, [H.buffer]);
    }
  };
}
if (typeof module !== 'undefined') module.exports = { terrainAt, genTerrainRows, genClouds, fbm, pnoise };
</script>
<script>
(() => {
'use strict';
// ============================================================
//  PATROL — core: config, math, palette, pixel font
// ============================================================
const QS = new URLSearchParams(location.search);
const CFG = {
  N: 2048,              // heightfield samples per side
  TILE: 8192,           // metres per heightfield tile
  NC: 1024,             // cloud map samples per side
  CTILE: 12288,         // metres per cloud tile
  CBASE: 300,           // cumulus base altitude
  CMAX: 230,            // max dome height above base
  WATER: 0,
  SEED: +(QS.get('seed') || 1337),
  CRUISE: 640,          // preferred cruising altitude (MSL)
  FAR: 15000,
  RES: +(QS.get('res') || 0),      // lock internal height
  TEST: QS.has('test'),
};
const DEG = Math.PI / 180;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrapPi = (a) => { a = (a + Math.PI) % (2 * Math.PI); if (a < 0) a += 2 * Math.PI; return a - Math.PI; };
const damp = (cur, target, rate, dt) => cur + (target - cur) * (1 - Math.exp(-rate * dt));
const mod = (a, n) => ((a % n) + n) % n;

// --- vec3 (plain arrays) ---
const v3 = (x = 0, y = 0, z = 0) => [x, y, z];
const vadd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const vsub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const vscl = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const vmad = (a, b, s) => [a[0] + b[0] * s, a[1] + b[1] * s, a[2] + b[2] * s];
const vdot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const vcross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const vlen = (a) => Math.hypot(a[0], a[1], a[2]);
const vnorm = (a) => { const l = vlen(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const vlerp = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

// --- quaternions [x,y,z,w] ---
const qaxis = (ax, ang) => { const s = Math.sin(ang / 2); return [ax[0] * s, ax[1] * s, ax[2] * s, Math.cos(ang / 2)]; };
const qmul = (a, b) => [
  a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
  a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
  a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
  a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2]];
const qnorm = (q) => { const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1; return [q[0] / l, q[1] / l, q[2] / l, q[3] / l]; };
const qrot = (q, v) => {
  const [x, y, z, w] = q;
  const ix = w * v[0] + y * v[2] - z * v[1], iy = w * v[1] + z * v[0] - x * v[2];
  const iz = w * v[2] + x * v[1] - y * v[0], iw = -x * v[0] - y * v[1] - z * v[2];
  return [ix * w + iw * -x + iy * -z - iz * -y, iy * w + iw * -y + iz * -x - ix * -z, iz * w + iw * -z + ix * -y - iy * -x];

const qslerp = (a, b, t) => {
  let d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3];

  if (d < 0) { d = -d; bb = [-b[0], -b[1], -b[2], -b[3]]; }
  if (d > 0.9995) return qnorm([lerp(a[0], bb[0], t), lerp(a[1], bb[1], t), lerp(a[2], bb[2], t), lerp(a[3], bb[3], t)]);

  return [a[0] * wa + bb[0] * wb, a[1] * wa + bb[1] * wb, a[2] * wa + bb[2] * wb, a[3] * wa + bb[3] * wb];

const qbasis = (r, u, b) => {

  if (tr > 0) { const s = Math.sqrt(tr + 1) * 2; q = [(m21 - m12) / s, (m02 - m20) / s, (m10 - m01) / s, s / 4]; }
  else if (m00 > m11 && m00 > m22) { const s = Math.sqrt(1 + m00 - m11 - m22) * 2; q = [s / 4, (m01 + m10) / s, (m02 + m20) / s, (m21 - m12) / s]; }

const m4 = () => new Float32Array(16);

}

  o[10] = (f + n) / (n - f); o[11] = -1; o[14] = 2 * f * n / (n - f);

}

  o[12] = -(r + l) / (r - l); o[13] = -(t + b) / (t - b); o[14] = -(f + n) / (f - n); o[15] = 1;

}

function m4qt(q, p, s = 1) {

  o[4] = 2 * (x * y - z * w) * s; o[5] = (1 - 2 * (x * x + z * z)) * s; o[6] = 2 * (y * z + x * w) * s;
  o[8] = 2 * (x * z + y * w) * s; o[9] = 2 * (y * z - x * w) * s; o[10] = (1 - 2 * (x * x + y * y)) * s;

}
// view matrix (inverse of camera transform)
function m4view(q, p) {

  const r01 = 2 * (x * y - z * w), r11 = 1 - 2 * (x * x + z * z), r21 = 2 * (y * z + x * w);
  const r02 = 2 * (x * z + y * w), r12 = 2 * (y * z - x * w), r22 = 1 - 2 * (x * x + y * y);
  o[0] = r00; o[4] = r10; o[8] = r20;
  o[1] = r01; o[5] = r11; o[9] = r21;
  o[2] = r02; o[6] = r12; o[10] = r22;
  o[12] = -(r00 * p[0] + r10 * p[1] + r20 * p[2]);

//  Shaders

const GLSL_DEFS = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
#define TILE ${CFG.TILE.toFixed(1)}
#define CTILE ${CFG.CTILE.toFixed(1)}
#define CBASE ${CFG.CBASE.toFixed(1)}
#define CMAX ${CFG.CMAX.toFixed(1)}
#define FAR ${CFG.FAR.toFixed(1)}
`;

const GLSL_COMMON = `
uniform vec3 uSunD, uSunS, uSunL;
uniform vec2 uSunH;
uniform vec3 uCam;
uniform float uTime;

const float BAYER[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
float bayer(vec2 f) { ivec2 p = ivec2(f) & 3; return (BAYER[p.x + p.y * 4] + 0.5) / 16.0; }
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3. - 2. * f);
  return mix(mix(hash12(i), hash12(i + vec2(1., 0.)), u.x), mix(hash12(i + vec2(0., 1.)), hash12(i + vec2(1., 1.)), u.x), u.y);
}

// horizon haze: gold toward the sun, lilac away from it
vec3 hazeCol(vec3 rd) {
  vec2 hz = normalize(rd.xz + vec2(1e-6));
  float s = dot(hz, uSunH) * 0.5 + 0.5;
  float sw = s * s * (3. - 2. * s); sw *= sw;
  vec3 c = mix(vec3(.80, .64, .78), vec3(1.0, .79, .50), sw);
  float sd = max(dot(rd, uSunD), 0.);
  c += vec3(1.0, .62, .30) * pow(sd, 18.) * 0.22;
  return c;
}

vec3 skyCol(vec3 rd) {
  float e = rd.y;
  vec3 hz = hazeCol(rd);
  if (e <= 0.0) return hz;
  vec2 h2 = normalize(rd.xz + vec2(1e-6));
  float s = dot(h2, uSunH) * 0.5 + 0.5;
  float sw = s * s * (3. - 2. * s); sw *= sw;
  vec3 mid = mix(vec3(.64, .52, .74), vec3(.96, .64, .55), sw);
  vec3 hi = mix(vec3(.38, .30, .58), vec3(.50, .36, .58), sw);
  vec3 zen = vec3(.18, .15, .36);
  vec3 c = mix(hz, mid, smoothstep(0.0, 0.12, e));
  c = mix(c, hi, smoothstep(0.10, 0.38, e));
  c = mix(c, zen, smoothstep(0.38, 0.95, e));
  // thin high streaks
  if (e > 0.015) {
    vec2 q = h2 * 4.0 + vec2(e * 70.0, -e * 52.0) + vec2(uTime * 0.002, 0.);
    float n = vnoise(q) * 0.62 + vnoise(q * vec2(3.1, 2.7) + 5.3) * 0.38;
    float band = step(0.70, n) * smoothstep(0.02, 0.05, e) * (1.0 - smoothstep(0.14, 0.32, e));
    band *= 1.0 - smoothstep(0.93, 0.99, dot(rd, uSunD));
    vec3 sc = mix(vec3(.98, .72, .70), vec3(1.0, .88, .66), sw);
    c = mix(c, sc, band * 0.8);
  }
  // sun: large disc with stepped glow rings
  float sd = dot(rd, uSunD);
  float ang = acos(clamp(sd, -1., 1.));
  vec3 g = vec3(1.0, .80, .45);
  c = mix(c, g, ang < 0.30 ? 0.10 : 0.0);
  c = mix(c, vec3(1.0, .85, .55), ang < 0.17 ? 0.18 : 0.0);
  c = mix(c, vec3(1.0, .90, .62), ang < 0.095 ? 0.35 : 0.0);
  if (ang < 0.056) c = mix(vec3(1.0, .86, .50), vec3(1.0, .97, .82), step(ang, 0.046));
  return c;
}

float fogAmt(vec3 ro, vec3 rd, float t) {
  const float a = 0.000165, b = 1.0 / 650.0;
  float k = rd.y * b;
  float base = a * exp(-max(ro.y, 0.) * b);
  float f = abs(k) < 1e-6 ? base * t : base * (1.0 - exp(-t * k)) / k;
  return max(1.0 - exp(-f), smoothstep(FAR * 0.72, FAR, t));
}
vec3 applyFog(vec3 c, vec3 ro, vec3 rd, float t) { return mix(c, hazeCol(rd), fogAmt(ro, rd, t)); }
`;

const VS_FULL = GLSL_DEFS + `

void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)) * 2.0 - 1.0;
  vNdc = p;
  gl_Position = vec4(p, 0.0, 1.0);
}`;

// ------------------------------------------------------------
//  World: ray-marched terrain, water, clouds, sky
// ------------------------------------------------------------
const FS_WORLD = GLSL_DEFS + GLSL_COMMON + `
in vec2 vNdc;
out vec4 oCol;
uniform sampler2D uHeight, uDetail, uShadow, uCloud, uJetSh;
uniform mat4 uVP, uJetShM;
uniform vec3 uCamR, uCamU, uCamF;
uniform vec4 uProj;
uniform vec3 uJetPos, uJetShDir;
uniform vec2 uCloudOff;
uniform float uCloudCut, uHMax, uPixAng;
uniform vec4 uFxA[8];
uniform vec4 uFxB[8];
uniform vec4 uLit[4];

float hgt(vec2 p) { return textureLod(uHeight, p * (1.0 / TILE), 0.0).r; }
float cld(vec2 p) { return textureLod(uCloud, (p + uCloudOff) * (1.0 / CTILE), 0.0).r; }

vec3 nrmT(vec2 p, float e) {
  float hx = hgt(p + vec2(e, 0.)) - hgt(p - vec2(e, 0.));
  float hz = hgt(p + vec2(0., e)) - hgt(p - vec2(0., e));
  return normalize(vec3(-hx, 2.0 * e, -hz));
}

float marchT(vec3 ro, vec3 rd, float t, float t1) {
  float tp = t;
  for (int i = 0; i < 150; i++) {
    vec3 p = ro + rd * t;
    float d = p.y - hgt(p.xz);
    if (d < 0.0) {
      float a = tp, b = t;
      for (int k = 0; k < 6; k++) {
        float m = 0.5 * (a + b); vec3 q = ro + rd * m;
        if (q.y - hgt(q.xz) < 0.0) b = m; else a = m;
      }
      return b;
    }
    if (t >= t1) break;
    tp = t;
    t = min(t + max(d * 0.45, 0.4 + t * 0.0045), t1);
  }
  return -1.0;
}

bool inCloud(vec3 p) { float c = cld(p.xz); return c > 0.5 && p.y > CBASE && p.y < CBASE + c; }

float marchC(vec3 ro, vec3 rd, float tEnd, out float tFog) {
  tFog = 0.0;
  float top = CBASE + CMAX;
  float ta, tb;
  if (abs(rd.y) < 1e-5) {
    if (ro.y < CBASE || ro.y > top) return -1.0;
    ta = 0.0; tb = tEnd;
  } else {
    float t1 = (CBASE - ro.y) / rd.y, t2 = (top - ro.y) / rd.y;
    ta = max(min(t1, t2), 0.0); tb = min(max(t1, t2), tEnd);
  }
  if (ta >= tb) return -1.0;
  float t = ta, tp = ta;
  vec3 p0 = ro + rd * (ta + 0.05);
  bool inside = inCloud(p0);
  if (inside && ta > 0.0) return ta + 0.05;   // entered through the flat base
  for (int i = 0; i < 64; i++) {
    vec3 p = ro + rd * t;
    float c = cld(p.xz);
    float d = p.y - (CBASE + c);
    bool ins = c > 0.5 && d < 0.0 && p.y > CBASE;
    if (inside) {
      if (!ins) { inside = false; tFog += t - tp; }
      tp = t;
      t += 6.0;
    } else if (ins) {
      float a = tp, b = t;
      for (int k = 0; k < 5; k++) {
        float m = 0.5 * (a + b);
        if (inCloud(ro + rd * m)) b = m; else a = m;
      }
      return b;
    } else {
      tp = t;
      float sv = p.y >= CBASE ? d * 0.5 : 0.0;
      t += clamp(sv, 3.0 + t * 0.008, 26.0 + t * 0.02);
    }
    if (t >= tb) { if (inside) tFog += tb - tp; break; }
  }
  return -1.0;
}

float jetShadow(vec3 p) {
  vec4 s = uJetShM * vec4(p, 1.0);
  vec2 uv = s.xy * 0.5 + 0.5;
  if (uv.x <= 0.0 || uv.y <= 0.0 || uv.x >= 1.0 || uv.y >= 1.0) return 1.0;
  if (dot(p - uJetPos, uJetShDir) > -1.0) return 1.0;
  return 1.0 - texture(uJetSh, uv).r;
}

float cloudShadow(vec3 p) {
  float tt = (CBASE + 35.0 - p.y) / uSunS.y;
  if (tt <= 0.0) return 1.0;
  float c = cld(p.xz + uSunS.xz * tt);
  return c > 34.0 ? 0.0 : (c > 14.0 ? 0.5 : 1.0);
}

vec3 effects(vec3 col, vec3 p, bool water, float bt) {
  for (int i = 0; i < 8; i++) {
    vec4 a = uFxA[i], b = uFxB[i];
    if (b.x < 0.5) continue;
    float d = length(p.xz - a.xz);
    float age = a.w, R = b.y, life = b.z;
    if (d > R * 2.6) continue;
    float fade = 1.0 - smoothstep(life * 0.6, life, age);
    if (b.x < 1.5 && !water) {
      float edge = R * (0.62 + 0.55 * vnoise(p.xz * 0.11 + a.xz));

// ------------------------------------------------------------
//  Quad effects: afterburner plumes, shock rings
// ------------------------------------------------------------
const VS_FX = GLSL_DEFS + `
layout(location=0) in vec3 aPos;
layout(location=1) in vec2 aUV;
layout(location=2) in vec4 aK;   // kind, p1, p2, p3
uniform mat4 uVP;
out vec2 vUV; flat out vec4 vK; out vec3 vW;
void main() { vUV = aUV; vK = aK; vW = aPos; gl_Position = uVP * vec4(aPos, 1.0); }`;
const FS_FX = GLSL_DEFS + GLSL_COMMON + `
in vec2 vUV; flat in vec4 vK; in vec3 vW;
out vec4 oCol;
void main() {
  float bt = bayer(gl_FragCoord.xy);
  vec3 col; float a;
  if (vK.x < 0.5) {
    // plume: u along (0 at nozzle), v across (-1..1); p1 = power, p2 = seed
    float u = vUV.x, v = abs(vUV.y);
    float pw = vK.y;
    float fl = vnoise(vec2(u * 7.0 - uTime * 38.0, vK.z * 10.0 + uTime * 9.0));
    float w = (1.0 - u) * (0.75 + 0.25 * fl);
    if (v > w) discard;
    float r = v / max(w, 1e-3);
    float diamond = pw > 0.6 ? step(0.5, fract(u * 5.0 - 0.1)) : 0.0;
    float heat = (1.0 - u) * (1.0 - r * 0.8) + diamond * 0.12 * (1.0 - u);
    col = heat > 0.72 ? vec3(1.0, 1.0, .94) : heat > 0.52 ? vec3(1.0, .88, .46) : heat > 0.32 ? vec3(1.0, .58, .22) : vec3(.92, .30, .18);
    if (pw < 0.6) col = heat > 0.6 ? vec3(1.0, .78, .40) : vec3(.95, .42, .22);
    a = clamp((1.0 - u * u) * (0.55 + pw * 0.6) - r * 0.25, 0.0, 1.0);
  } else {
    // shock ring on a horizontal quad: p1 = age 0..1, p2 = thickness
    float d = length(vUV);
    float th = vK.z;
    float k = abs(d - (1.0 - th));
    if (k > th) discard;
    col = k < th * 0.4 ? vec3(1.0, .97, .88) : vec3(.98, .80, .62);
    a = 1.0 - vK.y;
  }
  if (a < bt) discard;
  oCol = vec4(col, 0.0);
}`;

// ------------------------------------------------------------
//  Lines: wingtip vapour trails
// ------------------------------------------------------------
const VS_LINE = GLSL_DEFS + `
layout(location=0) in vec4 aP;   // xyz, alpha
uniform mat4 uVP;
out float vA; out vec3 vW;
void main() { vA = aP.w; vW = aP.xyz; gl_Position = uVP * vec4(aP.xyz, 1.0); }`;
const FS_LINE = GLSL_DEFS + GLSL_COMMON + `
in float vA; in vec3 vW;
out vec4 oCol;
void main() {
  float a = vA * smoothstep(10.0, 48.0, length(vW - uCam));
  if (a < bayer(gl_FragCoord.xy)) discard;
  vec3 col = applyFog(vec3(.97, .95, .97), uCam, normalize(vW - uCam), length(vW - uCam));
  oCol = vec4(col, 0.0);

// ------------------------------------------------------------
//  Palette: Oklab nearest-pair lookup (64^3, built once on the GPU)
// ------------------------------------------------------------
const GLSL_OKLAB = `
vec3 oklab(vec3 c) {
  vec3 l = mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(0.04045, c));
  vec3 lms = vec3(0.4122214708 * l.r + 0.5363325363 * l.g + 0.0514459929 * l.b,
                  0.2119034982 * l.r + 0.6806995451 * l.g + 0.1073969566 * l.b,
                  0.0883024619 * l.r + 0.2817188376 * l.g + 0.6299787005 * l.b);
  lms = pow(max(lms, vec3(0.0)), vec3(1.0 / 3.0));
  vec3 o = vec3(0.2104542553 * lms.x + 0.7936177850 * lms.y - 0.0040720468 * lms.z,
                1.9779984951 * lms.x - 2.4285922050 * lms.y + 0.4505937099 * lms.z,
                0.0259040371 * lms.x + 0.7827717662 * lms.y - 0.8086757660 * lms.z);
  o.yz *= 1.15;   // favour hue fidelity a little over lightness
  return o;
}`;
const FS_LUT = GLSL_DEFS + GLSL_OKLAB + `
out vec4 oCol;
uniform sampler2D uPal;
uniform int uPalN;
void main() {
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec3 c = vec3(float(p.x & 63), float(p.y & 63), float((p.x >> 6) + (p.y >> 6) * 8)) / 63.0;
  vec3 L = oklab(c);
  float d1 = 1e9, d2 = 1e9; int i1 = 0, i2 = 0;
  for (int i = 0; i < uPalN; i++) {
    vec3 q = texelFetch(uPal, ivec2(i, 1), 0).rgb;
    vec3 dd = L - q;
    float d = dot(dd, dd);
    if (d < d1) { d2 = d1; i2 = i1; d1 = d; i1 = i; }
    else if (d < d2) { d2 = d; i2 = i; }
  }
  oCol = vec4(float(i1) / 255.0, float(i2) / 255.0, 0.0, 1.0);
}`;

// ------------------------------------------------------------
//  Post: outline + palette quantisation with 4x4 Bayer dithering
// ------------------------------------------------------------
const FS_POST = GLSL_DEFS + GLSL_OKLAB + `
in vec2 vNdc;
out vec4 oCol;
uniform sampler2D uScene, uPal, uLut;
uniform vec4 uFlash;     // rgb, amount
uniform vec4 uWhite;     // rgb, amount
uniform ivec2 uSize;
const float BAYER[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
void main() {
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec4 s = texelFetch(uScene, p, 0);
  if (s.a < 0.5) {
    ivec2 mx = uSize - 1;
    float m = max(max(texelFetch(uScene, clamp(p + ivec2(1, 0), ivec2(0), mx), 0).a, texelFetch(uScene, clamp(p - ivec2(1, 0), ivec2(0), mx), 0).a),
                  max(texelFetch(uScene, clamp(p + ivec2(0, 1), ivec2(0), mx), 0).a, texelFetch(uScene, clamp(p - ivec2(0, 1), ivec2(0), mx), 0).a));
    if (m > 0.5) { oCol = vec4(0.09, 0.06, 0.12, 1.0); return; }
  }
  vec3 c = s.rgb;
  c = mix(c, uWhite.rgb, uWhite.a);
  c = clamp(c + uFlash.rgb * uFlash.a, 0.0, 1.0);
  ivec3 q = ivec3(c * 63.0 + 0.5);
  vec4 lu = texelFetch(uLut, ivec2(q.r + (q.b & 7) * 64, q.g + (q.b >> 3) * 64), 0);
  int i1 = int(lu.r * 255.0 + 0.5), i2 = int(lu.g * 255.0 + 0.5);
  vec3 a = texelFetch(uPal, ivec2(i1, 1), 0).rgb, b = texelFetch(uPal, ivec2(i2, 1), 0).rgb;
  vec3 L = oklab(c);
  vec3 ab = b - a;
  float t = clamp(dot(L - a, ab) / max(dot(ab, ab), 1e-6), 0.0, 1.0);
  ivec2 bp = p & 3;
  float th = (BAYER[bp.x + bp.y * 4] + 0.5) / 16.0;
  oCol = vec4(texelFetch(uPal, ivec2(t > th ? i2 : i1, 0), 0).rgb, 1.0);
}`;

//  GL setup, world data, generation

const glCanvas = document.getElementById('gl');
const uiCanvas = document.getElementById('ui');
const gl = glCanvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: CFG.TEST, powerPreference: 'high-performance' });

function fail(msg) {
  const el = document.getElementById('fail');
  el.style.display = 'flex'; el.innerHTML = msg;
  document.getElementById('loader').classList.add('gone');
  throw new Error(msg.replace(/<[^>]+>/g, ''));
}
if (!gl) fail('Patrol needs WebGL2, which this browser or device does not offer.<br>Try a current version of Chrome, Firefox, Edge or Safari.');
glCanvas.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    console.error(log, '\n', src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n'));
    throw new Error('shader compile failed: ' + log);
  }
  return s;
}
function program(vs, fs, attribs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  if (attribs) attribs.forEach((a, i) => gl.bindAttribLocation(p, i, a));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link failed: ' + gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    const name = info.name.replace(/\[0\]$/, '');
    u[name] = gl.getUniformLocation(p, info.name);
  }
  return { p, u };
}
function tex2D(w, h, ifmt, fmt, type, data, filter, wrap, mips) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, type, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mips ? gl.LINEAR_MIPMAP_LINEAR : filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
  if (mips) gl.generateMipmap(gl.TEXTURE_2D);
  return t;
}

const PROG = {};
function buildPrograms() {
  PROG.world = program(VS_FULL, FS_WORLD);
  PROG.mesh = program(VS_MESH, FS_MESH, ['aPos', 'aNrm', 'aMat']);
  PROG.shadow = program(VS_MESH, FS_SHADOW, ['aPos', 'aNrm', 'aMat']);
  PROG.part = program(VS_PART, FS_PART);
  PROG.fx = program(VS_FX, FS_FX);
  PROG.line = program(VS_LINE, FS_LINE);
  PROG.post = program(VS_FULL, FS_POST);

// --------------- world data ---------------
const WORLD = {
  H: null, CL: null, hmax: 600, ready: false,
  texH: null, texD: null, texS: null, texC: null,
};
const SP = CFG.TILE / CFG.N;            // metres per height sample
const CSP = CFG.CTILE / CFG.NC;
const NM = CFG.N - 1, NCM = CFG.NC - 1;
function heightAt(x, z) {
  const H = WORLD.H;
  const fx = x / SP - 0.5, fz = z / SP - 0.5;
  const ix = Math.floor(fx), iz = Math.floor(fz);
  const tx = fx - ix, tz = fz - iz;
  const i0 = ix & NM, i1 = (ix + 1) & NM, j0 = (iz & NM) * CFG.N, j1 = ((iz + 1) & NM) * CFG.N;
  const a = H[j0 + i0], b = H[j0 + i1], c = H[j1 + i0], d = H[j1 + i1];
  return (a + (b - a) * tx) * (1 - tz) + (c + (d - c) * tx) * tz;
}
const groundAt = (x, z) => Math.max(heightAt(x, z), 0);
let cloudOffX = 0, cloudOffZ = 0;     // absolute wind drift (metres)
function cloudAt(x, z) {
  const C = WORLD.CL;
  const fx = (x - cloudOffX) / CSP - 0.5, fz = (z - cloudOffZ) / CSP - 0.5;
  const ix = Math.floor(fx), iz = Math.floor(fz);
  const tx = fx - ix, tz = fz - iz;
  const i0 = ix & NCM, i1 = (ix + 1) & NCM, j0 = (iz & NCM) * CFG.NC, j1 = ((iz + 1) & NCM) * CFG.NC;
  const a = C[j0 + i0], b = C[j0 + i1], c = C[j1 + i0], d = C[j1 + i1];
  return (a + (b - a) * tx) * (1 - tz) + (c + (d - c) * tx) * tz;
}
// ray against terrain/water on the CPU; returns distance or -1
function raycastGround(o, d, maxT) {
  let t = 2, prev = t;
  for (let i = 0; i < 400 && t < maxT; i++) {
    const p = vmad(o, d, t);
    const h = groundAt(p[0], p[2]);
    const dy = p[1] - h;
    if (dy < 0) {
      let a = prev, b = t;
      for (let k = 0; k < 10; k++) { const m = (a + b) / 2, q = vmad(o, d, m); if (q[1] - groundAt(q[0], q[2]) < 0) b = m; else a = m; }
      return b;
    }
    prev = t;
    t += Math.max(dy * 0.45, 3 + t * 0.004);
  }
  return -1;
}

function bakeShadows(H, N) {
  // sun from the south-west: march cells along the diagonal away from the sun, carrying the shadow height
  const S = new Uint8Array(N * N);
  const drop = SP * Math.SQRT2 * Math.tan(10 * DEG);
  const M = N - 1;
  for (let d = 0; d < N; d++) {
    let s = -1e9;
    for (let pass = 0; pass < 2; pass++) {
      for (let k = 0; k < N; k++) {
        const i = (d + k) & M, j = (N - k) & M, idx = j * N + i;
        const h = H[idx] > 0 ? H[idx] : 0;
        s -= drop;
        if (pass === 1) {
          const occ = s - h;
          S[idx] = occ <= 0 ? 255 : Math.max(0, 255 - occ * 70) | 0;
        }
        if (h > s) s = h;
      }
    }
  }
  return S;
}

function generateWorld(onProgress) {
  return new Promise((resolve, reject) => {
    const N = CFG.N, M = N >> 1, CH = 64;
    const H = new Float32Array(N * N), D = new Uint8Array(M * M * 4);
    let CL = null;
    const tasks = [{ type: 'clouds', NC: CFG.NC, seed: CFG.SEED, tileC: CFG.CTILE, id: 0 }];
    for (let r = 0; r < N; r += CH) tasks.push({ type: 'terrain', N, seed: CFG.SEED, row0: r, row1: r + CH, id: tasks.length });
    const total = tasks.length;
    let done = 0, next = 0;
    const accept = (m) => {
      const task = tasks[m.id];
      if (!task || task.done) return;
      task.done = true;
      if (m.type === 'terrain') {
        H.set(m.heights, m.row0 * N);
        D.set(m.det, (m.row0 >> 1) * M * 4);
      } else CL = m.H;
      done++;
      onProgress(done / total, done < total * 0.3 ? 'raising hills' : done < total * 0.6 ? 'filling lakes' : done < total * 0.9 ? 'colouring the forests' : 'seeding clouds');
      if (done === total) resolve({ H, D, CL });
    };
    const src = document.getElementById('gen-src').textContent;
    let workers = [];
    try {
      const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
      const nW = clamp((navigator.hardwareConcurrency || 4) - 1, 2, 8);
      for (let i = 0; i < nW; i++) workers.push(new Worker(url));
    } catch (e) { workers = []; }
    if (workers.length) {
      let failed = false;
      const feed = (w) => { if (next < total) w.postMessage(tasks[next++]); else w.terminate(); };
      workers.forEach(w => {
        w.onmessage = (e) => { accept(e.data); feed(w); };
        w.onerror = (e) => {
          if (failed) return; failed = true;
          workers.forEach(x => x.terminate());
          console.warn('worker generation failed, falling back to main thread', e.message);
          mainThread(tasks.filter(t => !t.done));
        };
        feed(w);
      });
    } else mainThread(tasks);
    function mainThread(list) {
      const G = new Function(src + '\nreturn { genTerrainRows, genClouds };')();
      let k = 0;
      const step = () => {
        const t = list[k++];
        if (!t) return;
        if (t.type === 'terrain') { const r = G.genTerrainRows(t.N, t.seed, t.row0, t.row1); accept({ type: 'terrain', id: t.id, row0: t.row0, heights: r.heights, det: r.det }); }
        else accept({ type: 'clouds', id: t.id, H: G.genClouds(t.NC, t.seed, t.tileC) });
        if (k < list.length) setTimeout(step, 0);
      };
      setTimeout(step, 0);
    }
  });
}

function uploadWorld(H, D, CL) {
  const N = CFG.N, M = N >> 1;
  WORLD.H = H; WORLD.CL = CL;
  let mx = 0; for (let i = 0; i < H.length; i++) if (H[i] > mx) mx = H[i];
  WORLD.hmax = mx + 4;
  WORLD.texH = tex2D(N, N, gl.R16F, gl.RED, gl.FLOAT, H, gl.LINEAR, gl.REPEAT, false);
  WORLD.texD = tex2D(M, M, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, D, gl.LINEAR, gl.REPEAT, true);
  WORLD.texS = tex2D(N, N, gl.R8, gl.RED, gl.UNSIGNED_BYTE, bakeShadows(H, N), gl.LINEAR, gl.REPEAT, false);
  WORLD.texC = tex2D(CFG.NC, CFG.NC, gl.R16F, gl.RED, gl.FLOAT, CL, gl.LINEAR, gl.REPEAT, false);
  WORLD.ready = true;
}

// palette texture: row 0 = sRGB, row 1 = Oklab
let texPal = null;
let texLut = null;
function buildPalette() {
  const n = PALETTE.length, d = new Float32Array(n * 2 * 4);
  PALETTE.forEach((c, i) => {
    const L = oklab(c);
    d.set([c[0], c[1], c[2], 1], i * 4);
    d.set([L[0], L[1] * 1.15, L[2] * 1.15, 1], (n + i) * 4);
  });

  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texLut, 0);
  gl.viewport(0, 0, 512, 512);
  gl.useProgram(PROG.lut.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texPal);
  gl.uniform1i(PROG.lut.u.uPal, 0); gl.uniform1i(PROG.lut.u.uPalN, n);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.deleteFramebuffer(fb);
}

// --------------- render targets ---------------
const RT = { w: 0, h: 0, fbo: null, color: null, depth: null };

//  Low-poly meshes (object space: x right, y up, z back; nose at -z)
// ============================================================
// materials: 0 camo, 1 radome/dark, 2 canopy gold, 3 red cap, 4 nozzle glow, 5 dark metal, 6 missile white, 7 missile band, 8 light metal
function MeshBuilder() {
  const v = [];
  const tri = (a, b, c, mat, ref) => {
    let n = vnorm(vcross(vsub(b, a), vsub(c, a)));
    if (ref) {
      const ctr = vscl(vadd(vadd(a, b), c), 1 / 3);
      const out = typeof ref === 'function' ? ref(ctr) : vsub(ctr, ref);
      if (vdot(n, out) < 0) n = vscl(n, -1);
    }
    for (const p of [a, b, c]) v.push(p[0], p[1], p[2], n[0], n[1], n[2], mat);
  };
  const quad = (a, b, c, d, mat, ref) => { tri(a, b, c, mat, ref); tri(a, c, d, mat, ref); };
  return { v, tri, quad, data: () => new Float32Array(v), count: () => v.length / 7 };
}

function buildJet() {
  const B = MeshBuilder();

    [-8.4, 0.00, 0.00, 0.00, -0.02, 1],
    [-7.5, 0.24, 0.22, 0.20, 0.00, 1],
    [-6.3, 0.44, 0.42, 0.38, 0.02, 1],
    [-5.3, 0.54, 0.56, 0.44, 0.04, 0],
    [-3.8, 0.64, 0.70, 0.50, 0.05, 0],

const G0 = 9.81;
const jet = {
  pos: [0, CFG.CRUISE, 0], psi: 200 * DEG, theta: 0, phi: 0, v: 165, aoa: 1.2 * DEG,
  throttle: 0.62, abAmt: 0, ab: false,
  rollT: -1, rollDir: 1, rollAng: 0, rollOff: [0, 0, 0],
  qAtt: [0, 0, 0, 1], qRender: [0, 0, 0, 1], renderPos: [0, 0, 0],
  vel: [0, 0, 0], prevVel: null, accel: [0, 0, 0],
  g: 1, gLat: 0, gSm: 1, turnRate: 0, vs: 0,
  pullUp: false, groundH: 0, radarAlt: 0, overWater: true,
  rpmL: 72, rpmR: 72, egt: 560, ff: 1.2,
};
const ctl = { ix: 0, iy: 0, auto: true, autoT: 0, abHeld: false, abTouch: false };

function jetFwd(psi, theta) { return [Math.sin(psi) * Math.cos(theta), Math.sin(theta), -Math.cos(psi) * Math.cos(theta)]; }

function findSpawn() {
  // look for a spot over a lake, upwind of plenty of shoreline, facing roughly south
  let best = null, bestScore = -1e9;
  const r = mulberry(CFG.SEED + 99);
  for (let n = 0; n < 400; n++) {
    const x = r() * CFG.TILE, z = r() * CFG.TILE;
    if (heightAt(x, z) > -3) continue;
    let water = 0, land = 0, hi = 0;
    for (let k = 0; k < 24; k++) {
      const a = k / 24 * Math.PI * 2;
      for (const d of [500, 1100, 2000]) {
        const h = heightAt(x + Math.cos(a) * d, z + Math.sin(a) * d);
        if (h < 0) water++; else { land++; hi = Math.max(hi, h); }
      }
    }
    const score = -Math.abs(water - land * 0.9) + Math.min(hi, 400) * 0.05;
    if (score > bestScore) { bestScore = score; best = [x, z]; }
  }
  if (!best) best = [CFG.TILE * 0.5, CFG.TILE * 0.5];
  jet.pos = [best[0] + CFG.TILE * 3, CFG.CRUISE, best[1] + CFG.TILE * 3];
  jet.psi = 196 * DEG;
}

function flightStep(dt, input) {
  const j = jet;
  let ix = input.ix, iy = input.iy;
  // turn demand -> coordinated bank (so G, slip ball and turn needle stay physically consistent)
  const OMAX = 23 * DEG;
  const omegaT = clamp(ix, -1, 1) * OMAX;
  const phiT = Math.atan(j.v * omegaT / G0);
  let thetaT = iy * (iy > 0 ? 34 : 40) * DEG;
  // terrain avoidance: steepest required climb angle over a short look-ahead
  let req = -1;
  const sx = Math.sin(j.psi), sz = -Math.cos(j.psi);
  const look = [0, 0.35, 0.7, 1.1, 1.6, 2.2, 3.0, 4.0, 5.2];
  for (const s of look) {
    const d = j.v * s + 30;
    const x = j.pos[0] + sx * d, z = j.pos[2] + sz * d;
    const h = heightAt(x, z);
    const clr = h > 0.5 ? 42 + s * 6 : 8;
    const need = Math.atan2(Math.max(h, 0) + clr - j.pos[1], d);
    if (need > req) req = need;
  }
  j.pullUp = req > thetaT + 2 * DEG && req > -0.01;
  thetaT = Math.max(thetaT, Math.min(req * 1.15, 55 * DEG));
  // soft ceiling
  if (j.pos[1] > 1900) thetaT = Math.min(thetaT, lerp(12 * DEG, -8 * DEG, clamp((j.pos[1] - 1900) / 500, 0, 1)));
  // roll & pitch dynamics (rate limited)
  const dPhi = clamp((phiT - j.phi) * 3.4, -170 * DEG, 170 * DEG);
  j.phi = clamp(j.phi + dPhi * dt, -84 * DEG, 84 * DEG);
  const kTh = j.pullUp ? 3.4 : 2.0;
  const dTh = clamp((thetaT - j.theta) * kTh, -38 * DEG, (j.pullUp ? 55 : 38) * DEG);
  j.theta += dTh * dt;
  // coordinated-ish turn
  j.turnRate = G0 * Math.tan(j.phi) / j.v;
  j.psi = mod(j.psi + j.turnRate * dt, Math.PI * 2);
  // throttle & speed
  const abWant = ctl.abHeld || ctl.abTouch || input.ab;
  j.ab = abWant;
  j.abAmt = damp(j.abAmt, abWant ? 1 : 0, abWant ? 3.5 : 2.5, dt);
  j.throttle = damp(j.throttle, abWant ? 1 : 0.62 + Math.max(0, j.theta) * 0.6, 2.2, dt);
  const vT = lerp(158, 268, j.abAmt);
  j.v += ((vT - j.v) * 0.32 - G0 * Math.sin(j.theta) * 0.55) * dt;
  j.v = clamp(j.v, 105, 340);
  // integrate
  const f = jetFwd(j.psi, j.theta);
  const pv = j.vel;
  j.vel = vscl(f, j.v);
  if (j.velInit) j.accel = vscl(vsub(j.vel, pv), 1 / dt); else { j.velInit = true; j.accel = [0, 0, 0]; }
  j.pos = vmad(j.pos, j.vel, dt);
  // hard floor: it never touches the ground
  const hRaw = heightAt(j.pos[0], j.pos[2]);
  const gH = Math.max(hRaw, 0);
  const floor = hRaw > 0.4 ? 16 : 4.2;
  if (j.pos[1] < gH + floor) {
    j.pos[1] = gH + floor;
    if (j.theta < 0) j.theta *= 0.5;
  }
  j.groundH = gH; j.radarAlt = j.pos[1] - gH; j.overWater = hRaw < 0.4;
  j.vs = j.vel[1];
}

function updateJetDerived(dt) {
  const j = jet;
  // barrel roll animation
  let extra = 0;
  if (j.rollT >= 0) {
    j.rollT += dt;
    const T = 1.15, u = clamp(j.rollT / T, 0, 1);
    const e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    extra = e * Math.PI * 2 * j.rollDir;
    if (j.rollT >= T) j.rollT = -1;
  }
  j.rollAng = extra;
  // attitude: flight path + angle of attack + bank (+ barrel roll)
  const gTarget = 1 / Math.max(Math.cos(j.phi), 0.25);
  j.aoa = damp(j.aoa, (1.1 + (j.gSm - 1) * 0.9) * DEG, 4, dt);
  j.qAtt = qatt(j.psi, j.theta + j.aoa, j.phi + extra);
  const qFlight = qatt(j.psi, j.theta, j.phi);
  const up = qrot(qFlight, [0, 1, 0]), right = qrot(qFlight, [1, 0, 0]);
  const R = 5.5;
  j.rollOff = j.rollT >= 0 ? vadd(vscl(up, R * (1 - Math.cos(extra))), vscl(right, -R * Math.sin(extra))) : [0, 0, 0];
  j.renderPos = vadd(j.pos, j.rollOff);
  j.qRender = j.qAtt;
  // G: specific force along the body up axis
  const sf = vadd(j.accel, [0, G0, 0]);
  const bodyUp = qrot(j.qAtt, [0, 1, 0]), bodyRight = qrot(j.qAtt, [1, 0, 0]);
  let gNow = vdot(sf, bodyUp) / G0;
  if (!isFinite(gNow)) gNow = 1;
  j.g = clamp(gNow, -3, 9.5);
  j.gSm = damp(j.gSm, j.g, 6, dt);
  j.gLat = damp(j.gLat, clamp(vdot(sf, bodyRight) / G0, -2, 2), 5, dt);
  // engines
  const rpmT = 70 + j.throttle * 30 + j.abAmt * 3;
  j.rpmL = damp(j.rpmL, rpmT, 1.6, dt);
  j.rpmR = damp(j.rpmR, rpmT - 0.6, 1.4, dt);
  j.egt = damp(j.egt, 470 + j.throttle * 330 + j.abAmt * 140, 1.1, dt);
  j.ff = damp(j.ff, 0.9 + j.throttle * 4.2 + j.abAmt * 18, 2.0, dt);
}

function startBarrelRoll(dir) {
  if (jet.rollT >= 0) return;
  jet.rollT = 0;
  jet.rollDir = dir || (Math.abs(ctl.ix) > 0.08 ? Math.sign(ctl.ix) : (jet.rollDir > 0 ? -1 : 1));
  SFX.whoosh(0.6);
}

// ---------------- particles ----------------
const MAXP = 4000;
const PT = {
  n: 0,
  x: new Float64Array(MAXP), y: new Float64Array(MAXP), z: new Float64Array(MAXP),
  vx: new Float32Array(MAXP), vy: new Float32Array(MAXP), vz: new Float32Array(MAXP),
  size: new Float32Array(MAXP), grow: new Float32Array(MAXP), age: new Float32Array(MAXP), life: new Float32Array(MAXP),
  type: new Uint8Array(MAXP), seed: new Float32Array(MAXP), drag: new Float32Array(MAXP), grav: new Float32Array(MAXP),
  alpha: new Float32Array(MAXP), delay: new Float32Array(MAXP), floor: new Uint8Array(MAXP),

function spawn(type, p, v, size, life, o = {}) {
  let i = PT.n;
  if (i >= MAXP) {
    // recycle the oldest-looking slot
    i = (Math.random() * MAXP) | 0;
  } else PT.n++;
  PT.x[i] = p[0]; PT.y[i] = p[1]; PT.z[i] = p[2];
  PT.vx[i] = v[0]; PT.vy[i] = v[1]; PT.vz[i] = v[2];
  PT.size[i] = size; PT.grow[i] = o.grow || 0; PT.age[i] = 0; PT.life[i] = life;
  PT.type[i] = type; PT.seed[i] = Math.random(); PT.drag[i] = o.drag == null ? 0.5 : o.drag; PT.grav[i] = o.grav || 0;
  PT.alpha[i] = o.alpha == null ? 1 : o.alpha; PT.delay[i] = o.delay || 0; PT.floor[i] = o.floor ? 1 : 0;
}
function updateParticles(dt) {
  let n = PT.n;
  for (let i = 0; i < n; i++) {
    if (PT.delay[i] > 0) { PT.delay[i] -= dt; continue; }
    PT.age[i] += dt;

// ---------- canopy frame ----------
function drawCanopy(cw) {
  const W = OV.w, H = OV.h, ph = OV.L.ph;
  const bottom = H - ph + Math.round((1 - cw) * (ph + 20));
  DA = clamp(cw * 1.4 - 0.2, 0, 1);
  const off = Math.round((1 - cw) * 60);
  // side pillars
  for (const s of [-1, 1]) {
    for (let y = 0; y < bottom; y++) {
      const t = y / Math.max(bottom, 1);
      const xin = Math.round(lerp(W * 0.012, W * 0.085, Math.pow(t, 1.6))) - off;
      for (let x = 0; x <= xin; x++) px(s < 0 ? x : W - 1 - x, y, x === xin ? COL.frameHi : COL.frame);
    }
  }
  // top bow

// ---------- HUD ----------

  { const kt = Math.round(j.v * 1.94384);

// ---------- cursor ----------
function drawCursor(x, y, view, s) {

  const arm = 5, gap = 2;
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) for (let k = gap; k <= arm; k++) plot(dx * k, dy * k);
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) for (let k = gap; k <= arm; k++) px(x + dx * k, y + dy * k, c);

function drawStickLine(cx, cy, x, y) {

function ovResize(w, h) {

}

function setCommon(pr, camL, t) {
  const u = pr.u;
  if (u.uSunD) gl.uniform3fv(u.uSunD, SUN.disc);
  if (u.uSunS) gl.uniform3fv(u.uSunS, SUN.shadow);
  if (u.uSunL) gl.uniform3fv(u.uSunL, SUN.shade);
  if (u.uSunH) gl.uniform2f(u.uSunH, SUN.h[0], SUN.h[2]);
  if (u.uCam) gl.uniform3fv(u.uCam, camL);
  if (u.uTime) gl.uniform1f(u.uTime, t);

const FRAME = { VP: null, O: [0, 0, 0], aim: null };
function render(t) {
  const W = RT.w, H = RT.h;
  const O = [Math.floor(CAM.pos[0] / CFG.TILE) * CFG.TILE, 0, Math.floor(CAM.pos[2] / CFG.TILE) * CFG.TILE];
  const L = (p) => [p[0] - O[0], p[1], p[2] - O[2]];
  const camL = L(CAM.pos);
  const aspect = W / H;
  const P = m4persp(CAM.fov, aspect, 0.5, 30000, 0, CAM.shift);
  const V = m4view(CAM.q, camL);
  const VP = m4mul(P, V);
  FRAME.VP = VP; FRAME.O = O;
  const R = qrot(CAM.q, [1, 0, 0]), U = qrot(CAM.q, [0, 1, 0]), F = qrot(CAM.q, [0, 0, -1]);
  const tanY = Math.tan(CAM.fov / 2), tanX = tanY * aspect;
  const jetL = L(jet.renderPos);
  const showJet = CAM.cockpitW < 0.9;
  const jetM = m4qt(jet.qRender, jetL);

  // --- jet shadow map (stylised steep light so the shadow stays near the jet) ---
  const sq = lookRot(vscl(SUN.jet, -1), [0, 0, -1]);
  const SV = m4view(sq, vmad(jetL, SUN.jet, 200));
  const SVP = m4mul(m4ortho(-JS.half, JS.half, -JS.half, JS.half, 1, 420), SV);
  gl.bindFramebuffer(gl.FRAMEBUFFER, JS.fbo);

  gl.uniformMatrix4fv(PROG.shadow.u.uM, false, jetM);
  gl.bindVertexArray(MESH.jet.vao); gl.drawArrays(gl.TRIANGLES, 0, MESH.jet.count);
  gl.bindVertexArray(MESH.msl.vao);
  rails.forEach((r, i) => { if (!r.loaded) return; gl.uniformMatrix4fv(PROG.shadow.u.uM, false, m4qt(jet.qRender, vadd(jetL, qrot(jet.qRender, RAILS[i])))); gl.drawArrays(gl.TRIANGLES, 0, MESH.msl.count); });

  // --- world ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, RT.fbo);
  gl.viewport(0, 0, W, H);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.ALWAYS); gl.depthMask(true);
  gl.colorMask(true, true, true, true);
  const pw = PROG.world, u = pw.u;
  gl.useProgram(pw.p);
  setCommon(pw, camL, t);
  const tex = [[WORLD.texH, 'uHeight'], [WORLD.texD, 'uDetail'], [WORLD.texS, 'uShadow'], [WORLD.texC, 'uCloud'], [JS.tex, 'uJetSh']];
  tex.forEach(([tx, name], i) => { gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, tx); gl.uniform1i(u[name], i); });
  gl.uniformMatrix4fv(u.uVP, false, VP);
  gl.uniformMatrix4fv(u.uJetShM, false, SVP);
  gl.uniform3fv(u.uCamR, R); gl.uniform3fv(u.uCamU, U); gl.uniform3fv(u.uCamF, F);
  gl.uniform4f(u.uProj, tanX, tanY, 0, CAM.shift);
  gl.uniform3fv(u.uJetPos, jetL); gl.uniform3fv(u.uJetShDir, SUN.jet);
  gl.uniform2f(u.uCloudOff, mod(O[0] - cloudOffX, CFG.CTILE), mod(O[2] - cloudOffZ, CFG.CTILE));
  const jetDist = vlen(vsub(jetL, camL));
  gl.uniform1f(u.uCloudCut, CAM.cockpitW > 0.5 ? 0 : jetDist - 4);
  gl.uniform1f(u.uHMax, WORLD.hmax);
  gl.uniform1f(u.uPixAng, 2 * tanY / H);
  const fxA = new Float32Array(32), fxB = new Float32Array(32);
  FX.decals.slice(-8).forEach((d, i) => { const p = L(d.p); fxA.set([p[0], p[1], p[2], d.t], i * 4); fxB.set([d.type, d.r, d.life, 0], i * 4); });
  gl.uniform4fv(u.uFxA, fxA); gl.uniform4fv(u.uFxB, fxB);
  const lit = new Float32Array(16);
  FX.lights.slice(-4).forEach((l, i) => { const p = L(l.p); const k = 1 - l.t / l.life; lit.set([p[0], p[1], p[2], k * k * 1.2], i * 4); });

  gl.useProgram(pm.p);
  setCommon(pm, camL, t);
  gl.uniformMatrix4fv(pm.u.uVP, false, VP);
  gl.uniform1f(pm.u.uMask, 1);
  gl.uniform1f(pm.u.uFade, 1);
  const camJet = vlen(vsub(jetL, camL));
  const jetFade = CAM.blend < 1 ? clamp((camJet - 7) / 9, 0, 1) : 1;
  if (showJet && jetFade > 0) {
    gl.uniform1f(pm.u.uFade, jetFade); gl.uniform1f(pm.u.uMask, jetFade >= 1 ? 1 : 0);
    gl.uniform1f(pm.u.uGlow, clamp(0.25 + jet.throttle * 0.3 + jet.abAmt * 0.6, 0, 1));
    gl.uniformMatrix4fv(pm.u.uM, false, jetM);
    gl.bindVertexArray(MESH.jet.vao); gl.drawArrays(gl.TRIANGLES, 0, MESH.jet.count);
    gl.bindVertexArray(MESH.msl.vao);
    rails.forEach((r, i) => { if (!r.loaded) return; gl.uniformMatrix4fv(pm.u.uM, false, m4qt(jet.qRender, vadd(jetL, qrot(jet.qRender, RAILS[i])))); gl.drawArrays(gl.TRIANGLES, 0, MESH.msl.count); });
    gl.uniform1f(pm.u.uFade, 1); gl.uniform1f(pm.u.uMask, 1);
  }
  gl.bindVertexArray(MESH.msl.vao);
  for (const m of missiles) { gl.uniformMatrix4fv(pm.u.uM, false, m4qt(m.q, L(m.pos))); gl.drawArrays(gl.TRIANGLES, 0, MESH.msl.count); }

  // --- particles (screen-door transparency; alpha channel keeps the outline mask) ---
  gl.colorMask(true, true, true, false);
  let n = 0;
  const pd = DYN.pData;
  const put = (x, y, z, size, type, life, seed, alpha) => { const o = n * 8; pd[o] = x; pd[o + 1] = y; pd[o + 2] = z; pd[o + 3] = size; pd[o + 4] = type; pd[o + 5] = life; pd[o + 6] = seed; pd[o + 7] = alpha; n++; };
  for (let i = 0; i < PT.n; i++) {
    if (PT.delay[i] > 0) continue;
    put(PT.x[i] - O[0], PT.y[i], PT.z[i] - O[2], PT.size[i], PT.type[i], PT.age[i] / PT.life[i], PT.seed[i], PT.alpha[i]);
    if (n >= MAXP) break;
  }
  if (showJet) {
    const nav = (w, type, s) => { const p = vadd(jetL, qrot(jet.qRender, w)); put(p[0], p[1], p[2], s, type, 0, 0, 1); };
    nav([-5.0, -0.07, 3.75], 9, 0.28); nav([5.0, -0.07, 3.75], 10, 0.28);
    const st = t % 1.3;
    if (st < 0.06 || (st > 0.16 && st < 0.22)) { nav([-1.95, 3.0, 7.15], 11, 0.3); nav([1.95, 3.0, 7.15], 11, 0.3); }
    // nozzle glow discs (visible from behind)
    NOZZLES.forEach(z => { const p = vadd(jetL, qrot(jet.qRender, [z[0], z[1], z[2] + 0.15])); put(p[0], p[1], p[2], 0.34 + jet.abAmt * 0.12, 7, 0, 0, 1); });
  }
  for (const m of missiles) {
    if (m.t < 0.32) continue;
    const d = vnorm(m.vel), p = vmad(L(m.pos), d, -1.75);
    put(p[0], p[1], p[2], 0.55 + Math.random() * 0.35, 7, 0, 0, 1);
  }

    const pp = PROG.part;

    gl.uniform1f(pp.u.uPxScale, H / (2 * tanY));
    // sun direction projected to screen for puff shading
    const sr = vdot(SUN.disc, R), su = vdot(SUN.disc, U), sl = Math.hypot(sr, su) || 1;
    gl.uniform2f(pp.u.uSunScr, sr / sl, su / sl);
    gl.bindBuffer(gl.ARRAY_BUFFER, DYN.pBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, pd, 0, n * 8);
    gl.bindVertexArray(DYN.pVAO);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
  }

  // --- effect quads: plumes + shock rings ---
  let q = 0;
  const fd = DYN.fData;
  const vert = (p, uu, vv, k0, k1, k2) => { const o = q * 9; fd[o] = p[0]; fd[o + 1] = p[1]; fd[o + 2] = p[2]; fd[o + 3] = uu; fd[o + 4] = vv; fd[o + 5] = k0; fd[o + 6] = k1; fd[o + 7] = k2; fd[o + 8] = 0; q++; };
  const quad = (a, b, c, d, k0, k1, k2) => { vert(a, 0, -1, k0, k1, k2); vert(b, 0, 1, k0, k1, k2); vert(c, 1, -1, k0, k1, k2); vert(b, 0, 1, k0, k1, k2); vert(d, 1, 1, k0, k1, k2); vert(c, 1, -1, k0, k1, k2); };
  const plume = (A, axis, len, w, power, seed) => {
    const B = vmad(A, axis, len);
    const vd = vnorm(vsub(A, camL));
    let side = vcross(axis, vd);
    if (vlen(side) < 0.05) return;
    side = vscl(vnorm(side), w);
    quad(vadd(A, side), vsub(A, side), vadd(B, side), vsub(B, side), 0, power, seed);
  };
  if (showJet) {
    const back = qrot(jet.qRender, [0, 0, 1]);
    const ab = jet.abAmt;
    NOZZLES.forEach((z, i) => {
      const A = vadd(jetL, qrot(jet.qRender, [z[0], z[1], z[2] - 0.1]));
      const len = lerp(1.4 + jet.throttle * 0.8, 9.5, ab) * (0.92 + Math.random() * 0.16);
      plume(A, back, len, lerp(0.3, 0.5, ab), ab > 0.15 ? ab : 0.3, i * 0.37);
    });
  }
  for (const m of missiles) {
    if (m.t < 0.32) continue;
    const d = vnorm(m.vel);
    plume(vmad(L(m.pos), d, -1.6), vscl(d, -1), 3.2 + Math.random() * 1.2, 0.32, 1, 0.7);
  }
  for (const r of FX.rings) {
    const uu = r.t / r.life, rad = r.r * (1 - Math.pow(1 - uu, 2.4)) + 2;
    const c = L(r.p);
    const a = [c[0] - rad, c[1], c[2] - rad], b = [c[0] + rad, c[1], c[2] - rad], cc = [c[0] - rad, c[1], c[2] + rad], d = [c[0] + rad, c[1], c[2] + rad];

    quad(a, b, cc, d, 1, uu, lerp(0.09, 0.035, uu));

  }

    const pf = PROG.fx;

    gl.depthMask(false);
    gl.bindBuffer(gl.ARRAY_BUFFER, DYN.fBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, fd, 0, q * 9);
    gl.bindVertexArray(DYN.fVAO);
    gl.drawArrays(gl.TRIANGLES, 0, q);

  let lv = 0;
  const ld = DYN.lData;

    gl.depthMask(false);

    gl.bufferSubData(gl.ARRAY_BUFFER, 0, ld, 0, lv * 4);
    gl.bindVertexArray(DYN.lVAO);

  }

  // --- post: outline + palette dither to the screen ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.DEPTH_TEST);
  const pp2 = PROG.post;
  gl.useProgram(pp2.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, RT.color); gl.uniform1i(pp2.u.uScene, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texPal); gl.uniform1i(pp2.u.uPal, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texLut); gl.uniform1i(pp2.u.uLut, 2);
  gl.uniform4f(pp2.u.uFlash, 1.0, 0.86, 0.6, FX.flash * 0.55);
  gl.uniform4f(pp2.u.uWhite, 1, 1, 1, 0);
  gl.uniform2i(pp2.u.uSize, W, H);
  gl.bindVertexArray(null);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  return VP;
}

// ---------------- sizing & adaptive resolution ----------------
const PERF = { levels: [340, 300, 264, 232, 200, 176], idx: 0, acc: 0, n: 0, good: 0, scale: 1, locked: CFG.RES > 0 };
const isTouch = () => document.body.classList.contains('touch');
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const vw = window.innerWidth, vh = window.innerHeight;
  const dw = Math.round(vw * dpr), dh = Math.round(vh * dpr);
  const target = PERF.locked ? CFG.RES : PERF.levels[PERF.idx] * (isTouch() ? 0.88 : 1);
  const s = Math.max(1, Math.round(Math.min(dw, dh) / target));
  const W = Math.ceil(dw / s), H = Math.ceil(dh / s);
  PERF.scale = s;
  glCanvas.width = W; glCanvas.height = H;
  for (const c of [glCanvas, uiCanvas]) { c.style.width = (W * s / dpr) + 'px'; c.style.height = (H * s / dpr) + 'px'; }
  resizeTargets(W, H);
  ovResize(W, H);
}
function perfMonitor(dt) {
  if (PERF.locked || document.hidden) return;
  PERF.acc += dt; PERF.n++;
  if (PERF.acc < 1.5) return;
  const avg = PERF.acc / PERF.n;
  PERF.acc = 0; PERF.n = 0;
  if (avg > 1 / 44 && PERF.idx < PERF.levels.length - 1) { PERF.idx++; PERF.good = 0; resize(); }
  else if (avg < 1 / 58 && PERF.idx > 0) { if (++PERF.good >= 4) { PERF.idx--; PERF.good = 0; resize(); } }
  else PERF.good = 0;
}

// ---------------- input ----------------
const IN = { x: 0, y: 0, cssX: 0, cssY: 0, has: false, lmb: false, lmbT: 0, stick: null, stickO: [0, 0], test: null, firstMove: null };
let titleShown = false;
function toInternal(cx, cy) { const dpr = window.devicePixelRatio || 1; return [cx * dpr / PERF.scale, cy * dpr / PERF.scale]; }
function takeControl() {
  if (!ctl.auto) return;
  ctl.auto = false;
  hideTitle();
}
function hideTitle() { if (titleShown) { document.getElementById('title').classList.add('gone'); titleShown = false; } }
const stage = document.getElementById('stage');
window.addEventListener('mousemove', (e) => {
  IN.cssX = e.clientX; IN.cssY = e.clientY;
  [IN.x, IN.y] = toInternal(e.clientX, e.clientY);
  IN.has = true;
  if (!IN.firstMove) IN.firstMove = [e.clientX, e.clientY];
  else if (Math.hypot(e.clientX - IN.firstMove[0], e.clientY - IN.firstMove[1]) > 6 && WORLD.ready) takeControl();
});
stage.addEventListener('mousedown', (e) => {
  if (!WORLD.ready) return;
  if (e.button === 0) { IN.lmb = true; IN.lmbT = performance.now(); takeControl(); }
  else if (e.button === 2) { fireMissile(); takeControl(); }
  e.preventDefault();
});
window.addEventListener('mouseup', (e) => {
  if (e.button === 0 && IN.lmb) {
    IN.lmb = false; ctl.abHeld = false;
    if (performance.now() - IN.lmbT < 210 && WORLD.ready) startBarrelRoll();
  }
});
window.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('blur', () => { IN.lmb = false; ctl.abHeld = false; ctl.abTouch = false; });
window.addEventListener('keydown', (e) => {
  if (!WORLD.ready) return;
  if (e.code === 'Space') { setView((CAM.view + 1) % 3); takeControl(); e.preventDefault(); }
  else if (e.code === 'KeyF') { if (!e.repeat) fireMissile(); takeControl(); }
  else if (e.code === 'KeyM') { if (!e.repeat) toggleSound(); }
  else if (e.code === 'Digit1') setView(0);
  else if (e.code === 'Digit2') setView(1);
  else if (e.code === 'Digit3') setView(2);
  else if (e.code === 'KeyR') { if (!e.repeat) startBarrelRoll(); }
  else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') ctl.abKey = true;
});
window.addEventListener('keyup', (e) => { if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') ctl.abKey = false; });

// touch: virtual stick + buttons
function setupTouch() {
  const stick = document.getElementById('stick'), knob = stick.querySelector('i');
  const enable = () => {
    if (isTouch()) return;
    document.body.classList.add('touch');
    document.getElementById('hintKeys').innerHTML = '<b>drag</b> steer<span class="sep">/</span><b>burn</b> afterburner<span class="sep">/</span><b>roll</b><span class="sep">/</span><b>fire</b> missile<span class="sep">/</span><b>view</b>';
    document.getElementById('titleGo').textContent = 'drag anywhere to take the stick';
    resize();
  };
  stage.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'touch') return;
    enable();
    if (!WORLD.ready || IN.stick) return;
    IN.stick = { id: e.pointerId, x: e.clientX, y: e.clientY };
    IN.stickO = [0, 0];
    stick.style.display = 'block'; stick.style.left = e.clientX + 'px'; stick.style.top = e.clientY + 'px';
    knob.style.transform = 'translate(0,0)';
    takeControl();
  });
  window.addEventListener('pointermove', (e) => {
    if (!IN.stick || e.pointerId !== IN.stick.id) return;
    let dx = e.clientX - IN.stick.x, dy = e.clientY - IN.stick.y;
    const R = 48, l = Math.hypot(dx, dy);
    if (l > R) { dx *= R / l; dy *= R / l; }
    IN.stickO = [dx / R, -dy / R];
    knob.style.transform = `translate(${dx}px,${dy}px)`;
  });
  const end = (e) => { if (IN.stick && e.pointerId === IN.stick.id) { IN.stick = null; IN.stickO = [0, 0]; stick.style.display = 'none'; } };
  window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
  const btn = (id, down, up) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); enable(); el.classList.add('down'); if (WORLD.ready) { takeControl(); down(); } });
    const rel = () => { el.classList.remove('down'); if (up) up(); };
    el.addEventListener('pointerup', rel); el.addEventListener('pointercancel', rel); el.addEventListener('pointerleave', rel);
  };
  btn('tFire', () => fireMissile());
  btn('tRoll', () => startBarrelRoll());
  btn('tBurn', () => { ctl.abTouch = true; }, () => { ctl.abTouch = false; });
  btn('tView', () => setView((CAM.view + 1) % 3));
}

function computeInput(t) {
  const out = { ix: 0, iy: 0, ab: !!ctl.abKey };
  if (IN.test) return Object.assign(out, IN.test);
  if (IN.lmb && performance.now() - IN.lmbT > 200) ctl.abHeld = true;
  const altHold = () => clamp((CFG.CRUISE - jet.pos[1]) / 260, -0.45, 0.45);
  if (ctl.auto) {
    out.ix = 0.36 * Math.sin(t * Math.PI * 2 / 14);
    out.iy = altHold() + 0.06 * Math.sin(t * Math.PI * 2 / 23);
    return out;
  }
  const W = OV.w, H = OV.h;
  let ox, oy, active = true;
  if (IN.stick || isTouch()) {
    [ox, oy] = IN.stickO;
    active = Math.hypot(ox, oy) > 0.12;
    if (CAM.view !== 0) { ox *= 1.1; oy *= 1.1; }
  } else {
    let cx = W / 2, cy = H / 2;
    if (CAM.view === 2) cy = (1 - (CAM.shift * 0.5 + 0.5)) * H;
    if (CAM.view === 0) {
      const jp = projDir(FRAME.VP || m4(), vsub(vsub(jet.renderPos, CAM.pos), [0, 0, 0]));
      if (jp) { cx = jp[0]; cy = jp[1]; }
    }
    ox = (IN.x - cx) / (H / 2); oy = -(IN.y - cy) / (H / 2);
    active = Math.hypot(ox, oy) > 0.035;
  }
  if (CAM.view === 0) {
    if (active) {
      const want = Math.atan2(ox, oy);
      out.ix = clamp(wrapPi(want - jet.psi) * 1.5, -1, 1);
    }
    out.iy = altHold();
  } else {
    const dz = 0.05;
    out.ix = Math.sign(ox) * clamp((Math.abs(ox) - dz) / 0.72, 0, 1);
    out.iy = Math.sign(oy) * clamp((Math.abs(oy) - dz) / 0.6, 0, 1);
  }
  return out;
}

// ---------------- interface ----------------
const pipsEl = document.getElementById('pips');
let pipState = '';
function updateHints(t) {
  const s = rails.map(r => r.loaded ? '1' : '0').join('') + ((t * 2) | 0) % 2;
  if (s === pipState) return;
  pipState = s;
  pipsEl.innerHTML = [0, 2, 3, 1].map(i => `<span class="pip${rails[i].loaded ? '' : ' arm'}"></span>`).join('');
}
const soundBtn = document.getElementById('sound');
function toggleSound() {
  const on = SFX.toggle();
  soundBtn.textContent = on ? 'SOUND ON' : 'SOUND OFF';
  soundBtn.classList.toggle('on', on);
  soundBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
}
soundBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleSound(); soundBtn.blur(); });
soundBtn.addEventListener('mousedown', (e) => e.stopPropagation());
soundBtn.addEventListener('pointerdown', (e) => e.stopPropagation());

// ---------------- main loop ----------------
let simT = 0, accum = 0, lastNow = 0, paused = false, frameCount = 0;
function step(dt) {
  simT += dt;
  cloudOffX = simT * 4.0; cloudOffZ = -simT * 2.6;
  const inp = computeInput(simT);
  accum += dt;
  const h = 1 / 120;
  let n = 0;
  while (accum >= h && n < 30) { flightStep(h, inp); accum -= h; n++; }
  if (n === 30) accum = 0;
  updateJetDerived(dt);
  updateMissiles(dt);
  updateParticles(dt);
  updateFx(dt);
  updateTrails(dt);
  updateSkim(dt);
  updateCamera(dt);
  SFX.update(dt);
}
function cursorInfo() {
  if (!IN.has || isTouch() || ctl.auto) return null;
  const W = OV.w, H = OV.h;
  const c = { x: IN.x, y: IN.y, line: false };
  if (CAM.view !== 0 && CAM.blend >= 1) {
    c.line = true; c.cx = W / 2; c.cy = CAM.view === 2 ? (1 - (CAM.shift * 0.5 + 0.5)) * H : H / 2;
  }
  return c;
}
function drawFrame(dt) {
  FRAME.aim = CAM.cockpitW > 0.01 ? aimPoint() : null;
  const VP = render(simT);
  drawOverlay(dt, simT, VP, cursorInfo());
  updateHints(simT);
}
function frame(nowMs) {
  const now = nowMs / 1000;
  const dt = lastNow ? Math.min(now - lastNow, 0.1) : 1 / 60;
  lastNow = now;
  try {
    if (!paused) step(dt);
    drawFrame(paused ? 0 : dt);
    frameCount++;
    perfMonitor(dt);
  } catch (err) {
    console.error(err);
    window.PATROL && PATROL.errors.push(String(err && err.stack || err));
  }
  requestAnimationFrame(frame);
}

// ---------------- boot ----------------
const loadFill = document.getElementById('loadfill'), loadText = document.getElementById('loadtext');
function progress(f, msg) { loadFill.style.width = Math.round(f * 100) + '%'; loadText.textContent = msg + '  ' + Math.round(f * 100) + '%'; }
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
async function boot() {
  progress(0.02, 'warming up');
  await nextFrame();
  try {
    buildPrograms(); buildPalette(); buildMeshes(); buildJetShadowTarget(); initDynamic();
  } catch (e) {
    console.error(e);
    fail('The graphics card refused one of the shaders.<br><small>' + String(e.message || e).slice(0, 300) + '</small>');
  }
  setupTouch();
  const res = await generateWorld((f, msg) => progress(0.04 + f * 0.86, msg));
  progress(0.93, 'casting long shadows');
  await nextFrame();
  uploadWorld(res.H, res.D, res.CL);
  progress(1, 'ready');
  findSpawn();
  resize();
  window.addEventListener('resize', resize);
  // settle the cameras before the first frame
  for (let i = 0; i < 90; i++) step(1 / 60);
  await nextFrame();
  document.getElementById('loader').classList.add('gone');
  document.getElementById('title').classList.remove('gone');
  document.getElementById('hints').classList.add('on');
  titleShown = true;
  if (PATROL) PATROL.ready = true;
  requestAnimationFrame(frame);
}

// ---------------- test hooks ----------------
const PATROL = window.PATROL = {
  ready: false, errors: [],
  setView: (v) => setView(v),
  fire: () => fireMissile(),
  roll: (d) => startBarrelRoll(d),
  pause: (p) => { paused = !!p; },
  input: (o) => { IN.test = o; if (o) takeControl(); },
  step: (sec, dt = 1 / 60) => { const n = Math.round(sec / dt); for (let i = 0; i < n; i++) step(dt); },
  draw: () => { drawFrame(1 / 60); },
  state: () => ({
    pos: jet.pos.map(x => +x.toFixed(1)), psi: +(jet.psi / DEG).toFixed(1), theta: +(jet.theta / DEG).toFixed(1), phi: +(jet.phi / DEG).toFixed(1),
    v: +jet.v.toFixed(1), g: +jet.gSm.toFixed(2), alt: +jet.radarAlt.toFixed(1), view: CAM.view, blend: CAM.blend, missiles: missiles.length,
    loaded: missileCount(), particles: PT.n, res: [RT.w, RT.h], pullUp: jet.pullUp, frames: frameCount,
  }),
  glError: () => gl.getError(),
  typeCounts: () => { const c = {}; for (let i = 0; i < PT.n; i++) c[PT.type[i]] = (c[PT.type[i]] || 0) + 1; return c; },
  heightAt: (x, z) => heightAt(x, z),
  teleport: (x, z, alt, psiDeg) => { jet.pos = [x, alt, z]; if (psiDeg != null) jet.psi = psiDeg * DEG; jet.theta = 0; chase.pos = null; chase.q = null; TRAIL.pts = [[], []]; },
  look: (psiDeg, thetaDeg, alt) => { if (psiDeg != null) jet.psi = psiDeg * DEG; if (thetaDeg != null) jet.theta = thetaDeg * DEG; if (alt != null) jet.pos[1] = alt; chase.pos = null; chase.q = null; },
  jet, CAM, FX,
};
boot().catch((e) => { console.error(e); PATROL.errors.push(String(e && e.stack || e)); });

})();
</script>
